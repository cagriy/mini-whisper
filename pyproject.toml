[project]
name = "mini-whisper"
version = "0.1.1"
description = "macOS menu bar dictation app with Whisper STT and LLM cleanup"
requires-python = ">=3.12"
dependencies = [
    "rumps>=0.4.0",
    "pynput>=1.7.0",
    "sounddevice>=0.4.0",
    "soundfile>=0.12.0",
    "httpx>=0.27.0",
    "keyring>=25.0.0",
    "numpy>=1.26.0",
]

[project.scripts]
mini-whisper = "mini_whisper.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"
