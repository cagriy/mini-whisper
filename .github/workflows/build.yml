name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app
      - name: Install xcodegen
        run: brew install xcodegen
      - name: Core package tests
        working-directory: Packages/MiniWhisperCore
        run: swift test
      - name: Generate Xcode project
        run: xcodegen generate
      - name: App tests
        run: |
          xcodebuild -project "Mini Whisper.xcodeproj" \
            -scheme MiniWhisper -destination 'platform=macOS' test

  build:
    needs: unit-tests
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app
      - name: Install tooling
        run: brew install xcodegen create-dmg
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Resolve version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF#refs/tags/v}"
          else
            version=$(grep -m1 'MARKETING_VERSION:' project.yml | sed -E 's/.*"(.*)".*/\1/')
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build (Release, unsigned)
        run: |
          xcodebuild -project "Mini Whisper.xcodeproj" \
            -scheme MiniWhisper -destination 'platform=macOS' \
            -configuration Release -derivedDataPath .dd \
            CODE_SIGNING_ALLOWED=NO build
      - name: Create DMG
        run: |
          mkdir -p dist/stage
          cp -R ".dd/Build/Products/Release/Mini Whisper.app" dist/stage/
          create-dmg \
            --volname "Mini Whisper" \
            --app-drop-link 450 180 \
            --icon "Mini Whisper.app" 150 180 \
            --window-size 600 400 \
            "dist/MiniWhisper-${{ steps.version.outputs.version }}-arm64.dmg" \
            dist/stage
      - uses: actions/upload-artifact@v4
        with:
          name: MiniWhisper-${{ steps.version.outputs.version }}-arm64
          path: dist/*.dmg
