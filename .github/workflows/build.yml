name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      sign:
        description: 'Sign and notarize the build'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  unit-tests:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app
      - name: Install xcodegen
        run: brew install xcodegen
      - name: Core package tests
        working-directory: Packages/MiniWhisperCore
        run: swift test
      - name: Generate Xcode project
        run: xcodegen generate
      - name: App tests
        run: |
          xcodebuild -project "Mini Whisper.xcodeproj" \
            -scheme MiniWhisper -destination 'platform=macOS' test

  build:
    needs: unit-tests
    runs-on: macos-26
    env:
      APP_PATH: .dd/Build/Products/Release/Mini Whisper.app
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app
      - name: Install tooling
        run: brew install xcodegen create-dmg
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Resolve version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF#refs/tags/v}"
          else
            version=$(grep -m1 'MARKETING_VERSION:' project.yml | sed -E 's/.*"(.*)".*/\1/')
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build (Release, unsigned)
        run: |
          xcodebuild -project "Mini Whisper.xcodeproj" \
            -scheme MiniWhisper -destination 'platform=macOS' \
            -configuration Release -derivedDataPath .dd \
            CODE_SIGNING_ALLOWED=NO build

      - name: Import signing certificate
        if: >-
          (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
          || (github.event.inputs.sign == 'true')
        env:
          P12_BASE64: ${{ secrets.DEVELOPER_ID_APPLICATION_P12 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_APPLICATION_PASSWORD }}
        run: |
          CERT_PATH="$RUNNER_TEMP/certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"

          echo "$P12_BASE64" | base64 --decode > "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 \
            -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db

      - name: Sign .app
        if: >-
          (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
          || (github.event.inputs.sign == 'true')
        run: |
          IDENTITY="Developer ID Application"

          # Nested code first, outermost last. A SwiftPM-only app normally has
          # nothing here, but an embedded framework would break the outer seal.
          find "$APP_PATH" -type f \( -name "*.dylib" -o -name "*.so" \) \
            -exec codesign --force --options runtime --sign "$IDENTITY" \
            --entitlements App/MiniWhisper.entitlements --timestamp {} \;

          codesign --force --options runtime \
            --sign "$IDENTITY" \
            --entitlements App/MiniWhisper.entitlements \
            --timestamp \
            "$APP_PATH"

          codesign --verify --verbose=2 "$APP_PATH"

      - name: Create DMG
        run: |
          DMG_NAME="MiniWhisper-${{ steps.version.outputs.version }}-arm64.dmg"

          mkdir -p dist/stage
          cp -R "$APP_PATH" dist/stage/

          create-dmg \
            --volname "Mini Whisper" \
            --window-pos 200 120 \
            --window-size 660 400 \
            --icon-size 100 \
            --icon "Mini Whisper.app" 180 190 \
            --hide-extension "Mini Whisper.app" \
            --app-drop-link 480 190 \
            --no-internet-enable \
            "dist/$DMG_NAME" \
            dist/stage

          echo "dmg_name=$DMG_NAME" >> "$GITHUB_ENV"
          echo "dmg_path=dist/$DMG_NAME" >> "$GITHUB_ENV"

      - name: Notarize DMG
        if: >-
          (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
          || (github.event.inputs.sign == 'true')
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcrun notarytool submit "${{ env.dmg_path }}" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_ID_PASSWORD" \
            --team-id "$TEAM_ID" \
            --wait --timeout 600

          xcrun stapler staple "${{ env.dmg_path }}"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.dmg_name }}
          path: ${{ env.dmg_path }}

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') && (github.event_name == 'push' || github.event.inputs.sign == 'true')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.dmg_path }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, '-beta') || contains(github.ref, '-rc') }}

      - name: Update Homebrew tap
        if: startsWith(github.ref, 'refs/tags/v') && (github.event_name == 'push' || github.event.inputs.sign == 'true')
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          SHA256=$(shasum -a 256 "${{ env.dmg_path }}" | awk '{print $1}')
          VERSION="${APP_VERSION}"

          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/cagriy/homebrew-tap.git" tap
          cd tap

          sed -i '' "s/version \".*\"/version \"${VERSION}\"/" Casks/mini-whisper.rb
          sed -i '' "s/sha256 \".*\"/sha256 \"${SHA256}\"/" Casks/mini-whisper.rb

          git config user.email "1134069+cagriy@users.noreply.github.com"
          git config user.name "Cagri Yucel"
          git add Casks/mini-whisper.rb
          git commit -m "Update mini-whisper to ${VERSION}"
          git push
