name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      sign:
        description: 'Sign and notarize the build'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  unit-tests:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app
      - name: Install xcodegen
        run: brew install xcodegen uv
      - name: Appcast script tests
        run: uv run --no-project --with pytest pytest scripts/tests/
      - name: Core package tests
        working-directory: Packages/MiniWhisperCore
        run: swift test
      - name: Generate Xcode project
        run: xcodegen generate
      - name: App tests
        run: |
          xcodebuild -project "Mini Whisper.xcodeproj" \
            -scheme MiniWhisper -destination 'platform=macOS' test

  build:
    needs: unit-tests
    runs-on: macos-26
    env:
      APP_PATH: .dd/Build/Products/Release/Mini Whisper.app
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app
      - name: Install tooling
        run: brew install xcodegen create-dmg
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Resolve version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF#refs/tags/v}"
          else
            version=$(grep -m1 'MARKETING_VERSION:' project.yml | sed -E 's/.*"(.*)".*/\1/')
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build (Release, unsigned)
        run: |
          xcodebuild -project "Mini Whisper.xcodeproj" \
            -scheme MiniWhisper -destination 'platform=macOS' \
            -configuration Release -derivedDataPath .dd \
            CODE_SIGNING_ALLOWED=NO build

      - name: Import signing certificate
        if: >-
          (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
          || (github.event.inputs.sign == 'true')
        env:
          P12_BASE64: ${{ secrets.DEVELOPER_ID_APPLICATION_P12 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_APPLICATION_PASSWORD }}
        run: |
          CERT_PATH="$RUNNER_TEMP/certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"

          echo "$P12_BASE64" | base64 --decode > "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 \
            -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db

      - name: Sign .app
        if: >-
          (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
          || (github.event.inputs.sign == 'true')
        run: |
          IDENTITY="Developer ID Application"

          # Sparkle's helpers ship ad-hoc signed, which notarization rejects.
          # They keep their own entitlements, not the app's.
          SPARKLE_FW="$APP_PATH/Contents/Frameworks/Sparkle.framework"
          for nested in \
            "$SPARKLE_FW/Versions/B/XPCServices/Downloader.xpc" \
            "$SPARKLE_FW/Versions/B/XPCServices/Installer.xpc" \
            "$SPARKLE_FW/Versions/B/Autoupdate" \
            "$SPARKLE_FW/Versions/B/Updater.app"; do
            [[ -e "$nested" ]] || continue
            codesign --force --options runtime --timestamp \
              --preserve-metadata=entitlements --sign "$IDENTITY" "$nested"
          done
          codesign --force --options runtime --timestamp \
            --sign "$IDENTITY" "$SPARKLE_FW"

          # Nested code first, outermost last. A SwiftPM-only app normally has
          # nothing here, but an embedded framework would break the outer seal.
          find "$APP_PATH" -type f \( -name "*.dylib" -o -name "*.so" \) \
            -exec codesign --force --options runtime --sign "$IDENTITY" \
            --entitlements App/MiniWhisper.entitlements --timestamp {} \;

          codesign --force --options runtime \
            --sign "$IDENTITY" \
            --entitlements App/MiniWhisper.entitlements \
            --timestamp \
            "$APP_PATH"

          codesign --verify --deep --strict --verbose=2 "$APP_PATH"

      - name: Verify embedded frameworks resolve
        run: |
          # codesign, notarytool and stapler all pass on a binary dyld refuses
          # to start. herdr-notch v1.4.0 shipped notarized and stapled and died
          # with "Library not loaded: @rpath/Sparkle.framework/... no LC_RPATH's
          # found", so this is the only check that catches a missing runpath.
          binary="$APP_PATH/Contents/MacOS/Mini Whisper"
          rpaths=()
          while read -r p; do [[ -n "$p" ]] && rpaths+=("$p"); done < <(
            otool -l "$binary" | awk '/cmd LC_RPATH/{f=1} f&&/ path /{print $2; f=0}')
          while read -r dep; do
            [[ -n "$dep" ]] || continue
            rel="${dep#@rpath/}"
            found=false
            for rp in "${rpaths[@]}"; do
              resolved="${rp//@executable_path/$APP_PATH/Contents/MacOS}"
              resolved="${resolved//@loader_path/$APP_PATH/Contents/MacOS}"
              [[ -e "$resolved/$rel" ]] && { found=true; break; }
            done
            $found || {
              echo "error: $dep does not resolve (LC_RPATH: ${rpaths[*]:-none})" >&2
              echo "       the app would abort at launch; check LD_RUNPATH_SEARCH_PATHS" >&2
              exit 1
            }
          done < <(otool -L "$binary" | awk '/@rpath\//{print $1}' | sort -u)
          echo "all @rpath dependencies resolve"

      - name: Create DMG
        run: |
          DMG_NAME="MiniWhisper-${{ steps.version.outputs.version }}-arm64.dmg"

          mkdir -p dist/stage
          cp -R "$APP_PATH" dist/stage/

          create-dmg \
            --volname "Mini Whisper" \
            --window-pos 200 120 \
            --window-size 660 400 \
            --icon-size 100 \
            --icon "Mini Whisper.app" 180 190 \
            --hide-extension "Mini Whisper.app" \
            --app-drop-link 480 190 \
            --no-internet-enable \
            "dist/$DMG_NAME" \
            dist/stage

          echo "dmg_name=$DMG_NAME" >> "$GITHUB_ENV"
          echo "dmg_path=dist/$DMG_NAME" >> "$GITHUB_ENV"

      - name: Sign DMG
        if: >-
          (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
          || (github.event.inputs.sign == 'true')
        run: |
          # The app inside is signed either way; this signs the image itself, so
          # Gatekeeper can assess the download on its own signature. Releases up
          # to 0.4.0 shipped an unsigned image.
          codesign --sign "Developer ID Application" --timestamp "${{ env.dmg_path }}"

          # A malformed image wedges notarytool's file-type detection instead of
          # erroring, so refuse to submit anything hdiutil itself can't verify.
          hdiutil verify -quiet "${{ env.dmg_path }}"

      - name: Notarize DMG
        if: >-
          (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
          || (github.event.inputs.sign == 'true')
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcrun notarytool submit "${{ env.dmg_path }}" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_ID_PASSWORD" \
            --team-id "$TEAM_ID" \
            --wait --timeout 600

          xcrun stapler staple "${{ env.dmg_path }}"

      - name: Sparkle-sign the DMG
        if: >-
          (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
          || (github.event.inputs.sign == 'true')
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          # After stapling, never before: stapling rewrites the DMG.
          version=2.9.6
          sha256=52bf9e88cdd972fc0c81501377a880e90d47031bd8ca5462488f843e2609e192
          tarball="$RUNNER_TEMP/Sparkle-$version.tar.xz"
          tools="$RUNNER_TEMP/sparkle-$version"

          mkdir -p "$tools"
          curl -fsSL -o "$tarball" \
            "https://github.com/sparkle-project/Sparkle/releases/download/$version/Sparkle-$version.tar.xz"
          echo "$sha256  $tarball" | shasum -a 256 -c - >/dev/null
          tar -xJf "$tarball" -C "$tools"

          # By path, not argv, and outside the workspace.
          key_file="$RUNNER_TEMP/sparkle_ed_key"
          (umask 077; printf '%s' "$SPARKLE_PRIVATE_KEY" > "$key_file")

          out="$("$tools/bin/sign_update" --ed-key-file "$key_file" "${{ env.dmg_path }}")"
          echo "$out"

          echo "sparkle_signature=$(sed -E 's/.*sparkle:edSignature="([^"]+)".*/\1/' <<<"$out")" \
            >> "$GITHUB_ENV"
          echo "sparkle_length=$(sed -E 's/.*length="([^"]+)".*/\1/' <<<"$out")" \
            >> "$GITHUB_ENV"

      - name: Remove the Sparkle key
        if: always()
        run: rm -f "$RUNNER_TEMP/sparkle_ed_key"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.dmg_name }}
          path: ${{ env.dmg_path }}

      - name: Extract release notes
        if: startsWith(github.ref, 'refs/tags/v') && (github.event_name == 'push' || github.event.inputs.sign == 'true')
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          notes="$RUNNER_TEMP/notes.md"
          awk -v heading="## [$APP_VERSION]" '
            index($0, heading) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > "$notes"
          if [[ ! -s "$notes" ]]; then
            echo "error: CHANGELOG.md has no section for $APP_VERSION" >&2
            exit 1
          fi
          echo "notes_path=$notes" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') && (github.event_name == 'push' || github.event.inputs.sign == 'true')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.dmg_path }}
          body_path: ${{ env.notes_path }}
          draft: false
          prerelease: ${{ contains(github.ref, '-beta') || contains(github.ref, '-rc') }}

      - name: Update Homebrew tap
        if: startsWith(github.ref, 'refs/tags/v') && (github.event_name == 'push' || github.event.inputs.sign == 'true')
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          SHA256=$(shasum -a 256 "${{ env.dmg_path }}" | awk '{print $1}')
          VERSION="${APP_VERSION}"

          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/cagriy/homebrew-tap.git" tap
          cd tap

          sed -i '' "s/version \".*\"/version \"${VERSION}\"/" Casks/mini-whisper.rb
          sed -i '' "s/sha256 \".*\"/sha256 \"${SHA256}\"/" Casks/mini-whisper.rb

          git config user.email "1134069+cagriy@users.noreply.github.com"
          git config user.name "Cagri Yucel"
          git add Casks/mini-whisper.rb
          git commit -m "Update mini-whisper to ${VERSION}"
          git push

      - name: Publish appcast
        if: startsWith(github.ref, 'refs/tags/v') && (github.event_name == 'push' || github.event.inputs.sign == 'true')
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          # A tag build is a detached HEAD; the feed Sparkle reads lives on main.
          git fetch origin main
          git checkout -B main origin/main

          python3 scripts/appcast.py \
            --appcast appcast.xml \
            --version "$APP_VERSION" \
            --signature "$sparkle_signature" \
            --length "$sparkle_length" \
            --notes-file "$notes_path"

          if git diff --quiet appcast.xml; then
            echo "appcast already current for $APP_VERSION"
            exit 0
          fi

          git config user.email "1134069+cagriy@users.noreply.github.com"
          git config user.name "Cagri Yucel"
          git add appcast.xml
          git commit -m "Appcast: Mini Whisper $APP_VERSION"
          git push origin main
